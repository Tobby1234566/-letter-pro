<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — LetterPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafaf9; --surface: #ffffff; --border: #e7e5e4;
      --text: #1c1917; --text-secondary: #78716c;
      --accent: #2563eb; --accent-hover: #1d4ed8;
      --success: #16a34a; --warning: #ca8a04; --danger: #dc2626; --purple: #9333ea;
      --space-xs: 8px; --space-sm: 16px; --space-md: 24px; --space-lg: 48px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    h1, h2, h3, h4 { font-family: 'DM Sans', sans-serif; }
    a { color: inherit; text-decoration: none; }

    /* Layout */
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: var(--surface); border-right: 1px solid var(--border);
      padding: var(--space-md); display: flex; flex-direction: column;
      position: fixed; height: 100vh; overflow-y: auto;
    }
    .main { flex: 1; margin-left: 260px; padding: var(--space-lg); }

    /* Sidebar */
    .logo { font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: var(--space-lg); }
    .logo span { color: var(--accent); }
    .nav { list-style: none; flex: 1; }
    .nav li { margin-bottom: 4px; }
    .nav a {
      display: flex; align-items: center; gap: var(--space-sm); padding: 10px 12px;
      border-radius: 6px; color: var(--text-secondary); font-size: 0.875rem; font-weight: 500;
      transition: all 0.2s;
    }
    .nav a:hover, .nav a.active { background: rgba(37, 99, 235, 0.1); color: var(--accent); }
    .nav a i { width: 20px; height: 20px; }
    .logout-btn {
      display: flex; align-items: center; gap: var(--space-sm); padding: 10px 12px;
      border-radius: 6px; color: var(--text-secondary); font-size: 0.875rem; font-weight: 500;
      background: none; border: none; cursor: pointer; width: 100%; transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(220, 38, 38, 0.1); color: var(--danger); }

    /* Main Header */
    .main-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-lg); }
    .welcome h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .welcome p { color: var(--text-secondary); font-size: 0.875rem; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-lg); }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: var(--space-md); display: flex; align-items: center; gap: var(--space-md);
    }
    .stat-icon {
      width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .stat-icon.blue { background: rgba(37, 99, 235, 0.1); color: var(--accent); }
    .stat-icon.green { background: rgba(22, 163, 74, 0.1); color: var(--success); }
    .stat-icon.yellow { background: rgba(202, 138, 4, 0.1); color: var(--warning); }
    .stat-icon.purple { background: rgba(147, 51, 234, 0.1); color: var(--purple); }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; }
    .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

    /* Filters */
    .filters { display: flex; gap: var(--space-sm); margin-bottom: var(--space-md); flex-wrap: wrap; }
    .filters select, .filters input {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.875rem; background: var(--surface);
    }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
    .filters input { min-width: 200px; }

    /* Table */
    .requests-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .requests-table { width: 100%; border-collapse: collapse; }
    .requests-table th, .requests-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
    .requests-table th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); font-weight: 500; background: var(--bg); }
    .requests-table tr:last-child td { border-bottom: none; }
    .requests-table tr:hover td { background: var(--bg); }
    .requests-table td { vertical-align: middle; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px;
      border-radius: 4px; font-size: 0.75rem; font-weight: 500;
    }
    .badge.pending_payment { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .badge.payment_submitted { background: rgba(34, 197, 94, 0.1); color: var(--success); }
    .badge.pending { background: rgba(202, 138, 4, 0.1); color: var(--warning); }
    .badge.paid { background: rgba(37, 99, 235, 0.1); color: var(--accent); }
    .badge.in_progress { background: rgba(147, 51, 234, 0.1); color: var(--purple); }
    .badge.completed { background: rgba(22, 163, 74, 0.1); color: var(--success); }

    .price { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
    .priority-badge {
      display: inline-flex; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500;
    }
    .priority-badge.fast { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
    .priority-badge.medium { background: rgba(202, 138, 4, 0.1); color: var(--warning); }
    .priority-badge.normal { background: rgba(120, 113, 108, 0.1); color: var(--text-secondary); }

    .action-btns { display: flex; gap: 8px; }
    .action-btn {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .action-btn.primary:hover { background: var(--accent-hover); }
    .action-btn.success { background: var(--success); color: white; border-color: var(--success); }
    .action-btn.success:hover { background: #15803d; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface); border-radius: 12px; padding: var(--space-lg);
      width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { margin-bottom: var(--space-md); }
    .modal-close {
      float: right; background: none; border: none; cursor: pointer; color: var(--text-secondary);
    }
    .modal-close:hover { color: var(--text); }

    .modal-section { margin-bottom: var(--space-lg); padding-bottom: var(--space-lg); border-bottom: 1px solid var(--border); }
    .modal-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .modal-section h3 { font-size: 1rem; margin-bottom: var(--space-sm); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-sm); }
    .info-item { }
    .info-item label { font-size: 0.75rem; color: var(--text-secondary); display: block; margin-bottom: 2px; }
    .info-item span { font-size: 0.875rem; font-weight: 500; }

    .user-description {
      background: var(--bg); border-radius: 8px; padding: var(--space-md);
      white-space: pre-wrap; line-height: 1.6; margin-top: var(--space-sm);
    }

    .uploaded-image { max-width: 100%; border-radius: 8px; margin-top: var(--space-sm); }

    .form-group { margin-bottom: var(--space-sm); }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; }
    .form-group textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.875rem; font-family: 'Inter', sans-serif; background: var(--bg);
      min-height: 200px; resize: vertical; line-height: 1.6;
    }
    .form-group textarea:focus { outline: none; border-color: var(--accent); }

    .modal-footer { display: flex; gap: var(--space-sm); justify-content: flex-end; margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--border); }

    .btn {
      display: inline-flex; align-items: center; gap: var(--space-xs); padding: 8px 16px;
      font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600;
      border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #15803d; }

    .alert { padding: var(--space-sm); border-radius: 6px; margin-bottom: var(--space-sm); font-size: 0.875rem; display: none; }
    .alert.error { background: rgba(220, 38, 38, 0.1); color: var(--danger); border: 1px solid var(--danger); }
    .alert.success { background: rgba(22, 163, 74, 0.1); color: var(--success); border: 1px solid var(--success); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: var(--space-md); }
      .info-grid { grid-template-columns: 1fr; }
      .requests-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="/" class="logo">Letter<span>Pro</span></a>
      <ul class="nav">
        <li><a href="#" class="active"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
        <li><a href="#"><i data-lucide="file-text"></i> All Requests</a></li>
      </ul>
      <button class="logout-btn" id="logoutBtn">
        <i data-lucide="log-out"></i> Logout
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="main-header">
        <div class="welcome">
          <h1>Admin Dashboard</h1>
          <p>Manage all letter requests</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon blue"><i data-lucide="file-text" width="24" height="24"></i></div>
          <div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Total</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow"><i data-lucide="clock" width="24" height="24"></i></div>
          <div>
            <div class="stat-value" id="statPending">0</div>
            <div class="stat-label">Pending</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple"><i data-lucide="edit-3" width="24" height="24"></i></div>
          <div>
            <div class="stat-value" id="statInProgress">0</div>
            <div class="stat-label">In Progress</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i data-lucide="check-circle" width="24" height="24"></i></div>
          <div>
            <div class="stat-value" id="statCompleted">0</div>
            <div class="stat-label">Completed</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue"><i data-lucide="naira" width="24" height="24"></i></div>
          <div>
            <div class="stat-value" id="statRevenue">₦0</div>
            <div class="stat-label">Revenue</div>
          </div>
        </div>
      </div>

      <!-- Filters & Table -->
      <div class="filters">
        <select id="filterStatus">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
        <select id="filterPriority">
          <option value="">All Priority</option>
          <option value="fast">Fast</option>
          <option value="medium">Medium</option>
          <option value="normal">Normal</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search by name or email...">
      </div>

      <div class="requests-card">
        <table class="requests-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Customer</th>
              <th>Type</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Price</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="requestsBody">
            <tr><td colspan="8" style="text-align: center; padding: 40px; color: var(--text-secondary);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Request Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <button class="modal-close" id="modalClose"><i data-lucide="x" width="24" height="24"></i></button>
      <h2>Request #<span id="modalRequestId"></span></h2>

      <div class="alert" id="modalAlert"></div>

      <div class="modal-section">
        <h3>Request Details</h3>
        <div class="info-grid">
          <div class="info-item">
            <label>Customer</label>
            <span id="detailCustomer"></span>
          </div>
          <div class="info-item">
            <label>Email</label>
            <span id="detailEmail"></span>
          </div>
          <div class="info-item">
            <label>Letter Type</label>
            <span id="detailLetterType"></span>
          </div>
          <div class="info-item">
            <label>Priority</label>
            <span id="detailPriority"></span>
          </div>
          <div class="info-item">
            <label>Price</label>
            <span id="detailPrice"></span>
          </div>
          <div class="info-item">
            <label>Status</label>
            <span id="detailStatus"></span>
          </div>
        </div>
      </div>

      <div class="modal-section" id="descriptionSection" style="display: none;">
        <h3>Description</h3>
        <div class="user-description" id="detailDescription"></div>
      </div>

      <div class="modal-section" id="imageSection" style="display: none;">
        <h3>Uploaded Image</h3>
        <img id="detailImage" class="uploaded-image" alt="Uploaded image">
      </div>

      <div class="modal-section" id="receiptSection" style="display: none;">
        <h3>Payment Receipt</h3>
        <img id="detailReceipt" class="uploaded-image" alt="Payment receipt" style="max-height: 300px;">
        <div style="margin-top: 16px;">
          <button type="button" class="btn btn-success" id="approveReceiptBtn" onclick="approvePayment(currentRequest.id)">
            <i data-lucide="check" width="18" height="18"></i> Approve Payment
          </button>
        </div>
      </div>

      <div class="modal-section">
        <h3>Write Letter</h3>
        <form id="letterForm">
          <div class="form-group">
            <label for="letterContent">Letter Content</label>
            <textarea id="letterContent" placeholder="Write the letter here..."></textarea>
          </div>
          <input type="hidden" id="letterRequestId">
          <div class="modal-footer" style="margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: none;">
            <button type="submit" class="btn btn-primary">Save Letter</button>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="markPaidBtn">Mark as Paid</button>
        <button type="button" class="btn btn-success" id="sendLetterBtn">Send Letter</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LetterPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafaf9; --surface: #ffffff; --border: #e7e5e4;
      --text: #1c1917; --text-secondary: #78716c;
      --accent: #2563eb; --accent-hover: #1d4ed8;
      --danger: #dc2626; --success: #16a34a;
      --space-xs: 8px; --space-sm: 16px; --space-md: 24px;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: var(--space-md);
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: var(--space-lg); width: 100%; max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    .logo {
      font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 700;
      text-align: center; margin-bottom: var(--space-md);
    }
    .logo span { color: var(--accent); }
    h1 { font-family: 'DM Sans', sans-serif; font-size: 1.5rem; text-align: center; margin-bottom: var(--space-xs); }
    p.subtitle { color: var(--text-secondary); text-align: center; font-size: 0.875rem; margin-bottom: var(--space-md); }
    .form-group { margin-bottom: var(--space-sm); }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 1rem; font-family: 'Inter', sans-serif; transition: border-color 0.2s;
      background: var(--bg);
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .form-group input.error { border-color: var(--danger); }
    .error-message { color: var(--danger); font-size: 0.75rem; margin-top: 4px; display: none; }
    .btn {
      width: 100%; padding: 12px; font-family: 'DM Sans', sans-serif; font-size: 1rem;
      font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: var(--space-xs);
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { padding: var(--space-sm); border-radius: 6px; margin-bottom: var(--space-sm); font-size: 0.875rem; display: none; }
    .alert.error { background: rgba(220, 38, 38, 0.1); color: var(--danger); border: 1px solid var(--danger); }
    .alert.success { background: rgba(22, 163, 74, 0.1); color: var(--success); border: 1px solid var(--success); }
    .footer-text { text-align: center; margin-top: var(--space-md); font-size: 0.875rem; color: var(--text-secondary); }
    .footer-text a { color: var(--accent); font-weight: 500; }
    .footer-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <a href="/" class="logo">Letter<span>Pro</span></a>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your account</p>

    <div class="alert" id="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
        <div class="error-message" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password" style="padding-right: 40px;">
          <button type="button" onclick="togglePassword('password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 4px;">
            <i data-lucide="eye" width="18" height="18"></i>
          </button>
        </div>
        <div class="error-message" id="passwordError"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">
        <span>Sign In</span>
      </button>
    </form>

    <p class="footer-text">
      Don't have an account? <a href="register.html">Sign up free</a>
    </p>
    <p style="text-align: center; margin-top: 16px; font-size: 0.75rem; color: var(--text-secondary);">
      <a href="terms.html">Terms of Service</a> · <a href="privacy.html">Privacy Policy</a>
    </p>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById('loginForm');
    const alert = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Signing in...</span>';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Redirect based on role
        if (data.user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        alert.textContent = err.message;
        alert.className = 'alert error';
        alert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span>';
      }
    });

    // Toggle password visibility
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off" width="18" height="18"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye" width="18" height="18"></i>';
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
